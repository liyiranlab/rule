;============================================================
; 中国大陆专用 · 全 .mrs 二进制规则
; 所有地址已改用 jsDelivr CDN，国内可直接拉取
; 保存为 CMCC.ini 扔到 GitHub → raw 地址填进「远程配置」即可
;============================================================

[common]
#---- 基本开关 ----
udp=true
tcp-concurrent=true
unified-delay=true
global-client-fingerprint=chrome
#---- DNS ----
dns-server=https://dns.alidns.com/dns-query,https://doh.pub/dns-query
dns-fallback=https://223.5.5.5/dns-query
dns-fake-ip=true
dns-fake-ip-range=28.0.0.1/8
dns-ipv6=false
dns-hijack=any:53,tcp://any:53
#---- 嗅探 ----
sniffer-enable=true
sniff-override-dest=true

[filter]
# 节点重命名 / emoji（按需打开）
emoji=^(港|HK|Hong Kong)🇭🇰
emoji=^(日|JP|Japan)🇯🇵
emoji=^(美|US|States|America)🇺🇸
exclude=.*测试.*

[proxy_group]
#---- 策略组 ----
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动`[]🇭🇰 香港`[]🇯🇵 日本`[]🇺🇸 美国`[]DIRECT
custom_proxy_group=♻️ 自动`url-test`^((?!(DIRECT)).*)$`http://www.gstatic.com/generate_204`300,50,200
custom_proxy_group=🇭🇰 香港`url-test`(?=.*(港|HK|Hong))^((?!(台|日|新|美)).)*$`http://www.gstatic.com/generate_204`300,50,200
custom_proxy_group=🇯🇵 日本`url-test`(?=.*(日|JP|Japan))^((?!(港|台|韩|新|美)).)*$`http://www.gstatic.com/generate_204`300,50,200
custom_proxy_group=🇺🇸 美国`url-test`(?=.*(美|US|States|America))^((?!(港|台|韩|新|日)).)*$`http://www.gstatic.com/generate_204`300,50,200

[rule]
;-----------------------------------------------------------
;  以下 ruleset 地址全部为 .mrs 二进制
;  转换器会自动生成 「format: mrs」 的 rule-providers
;-----------------------------------------------------------
ruleset=private_domain.mrs,DIRECT
ruleset=cn_domain.mrs,DIRECT
ruleset=private_ip.mrs,DIRECT
ruleset=cn_ip.mrs,DIRECT
ruleset=apple_domain.mrs,DIRECT
ruleset=apple_ip.mrs,DIRECT
ruleset=proxylite.mrs,🚀 手动选择
ruleset=geolocation-!cn.mrs,🚀 手动选择
; 兜底
ruleset=🐟 漏网之鱼,[]FINAL


;============================================================
;  规则集地址（已确认国内可连，全部 .mrs）
;============================================================
; private_domain   -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
; cn_domain        -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
; private_ip       -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
; cn_ip            -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs
; apple_domain     -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs
; apple_ip         -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo-lite/geoip/apple.mrs
; proxylite        -> https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxylite.mrs
; geolocation-!cn  -> https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs